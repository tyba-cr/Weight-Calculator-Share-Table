<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Calculator</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:Canvas;color:CanvasText}.app{width:min(100%,520px);border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:18px;padding:24px;box-shadow:0 8px 32px #0002}h1{margin:0 0 6px;font-size:1.6rem}.hint{color:GrayText;margin:0 0 22px}.head,.entry{display:grid;grid-template-columns:34px 1fr 1fr 42px;gap:10px;align-items:center}.head{font-size:.9rem;font-weight:650;margin-bottom:8px}.entry{margin:9px 0}.entry input{width:100%;min-width:0;padding:11px;border:1px solid color-mix(in srgb,CanvasText 25%,transparent);border-radius:9px;background:Canvas;color:CanvasText;font:inherit}.num{color:GrayText;text-align:center}.remove{border:0;background:transparent;color:#d44;font-size:1.25rem;cursor:pointer}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}button{cursor:pointer;border:1px solid color-mix(in srgb,CanvasText 25%,transparent);border-radius:10px;padding:10px 14px;background:ButtonFace;color:ButtonText;font:inherit}.result{margin-top:22px;padding:18px;border-radius:13px;background:color-mix(in srgb,Highlight 10%,Canvas)}.label{font-size:.8rem;color:GrayText;font-weight:650;letter-spacing:.04em}.total{font-size:2rem;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}.sub{font-size:.85rem;color:GrayText;margin-top:4px}@media(max-width:420px){.app{padding:17px}.head,.entry{grid-template-columns:25px 1fr 1fr 30px;gap:6px}}
</style>
</head>
<body>
<main class="app">
<h1>Weight Calculator</h1>
<p class="hint">Add as many weights as you need. 16 ounces = 1 pound.</p>
<div class="head"><span></span><label for="lb0">Pounds (lbs)</label><label for="oz0">Ounces (oz)</label><span></span></div>
<div id="entries"></div>
<div class="actions"><button id="add" type="button">＋ Add another weight</button><button id="clear" type="button">Clear all</button></div>
<section class="result" aria-live="polite"><div class="label">TOTAL WEIGHT</div><div class="total" id="total">0.000 lbs</div><div class="sub" id="count">0 entries</div></section>
</main>
<script>
const list=document.getElementById('entries');let count=0;
function update(){let sum=0,used=0;for(const row of list.children){const lb=Number(row.querySelector('.lb').value)||0;const oz=Number(row.querySelector('.oz').value)||0;sum+=lb+oz/16;if(row.querySelector('.lb').value!==''||row.querySelector('.oz').value!=='')used++;}document.getElementById('total').textContent=sum.toFixed(3)+' lbs';document.getElementById('count').textContent=used+' filled '+(used===1?'entry':'entries');}
function addRow(lb='',oz=''){const id=count++;const row=document.createElement('div');row.className='entry';row.innerHTML=`<span class="num">${list.children.length+1}.</span><input class="lb" type="number" min="0" step="any" placeholder="0" aria-label="Pounds"><input class="oz" type="number" min="0" step="any" placeholder="0" aria-label="Ounces"><button class="remove" type="button" aria-label="Remove row">×</button>`;row.querySelector('.lb').value=lb;row.querySelector('.oz').value=oz;row.querySelectorAll('input').forEach(el=>el.addEventListener('input',update));row.querySelector('.remove').addEventListener('click',()=>{row.remove();renumber();update()});list.appendChild(row);renumber();update();}
function renumber(){[...list.children].forEach((r,i)=>r.querySelector('.num').textContent=(i+1)+'.')}
document.getElementById('add').addEventListener('click',()=>addRow());document.getElementById('clear').addEventListener('click',()=>{list.innerHTML='';for(let i=0;i<3;i++)addRow()});for(let i=0;i<3;i++)addRow();
</script>
</body>
</html>
